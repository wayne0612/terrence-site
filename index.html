<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Terry 的个人作品集网站" />
  <meta name="theme-color" content="#0C0C0E" />
  <title>Hi, Terry!</title>
  <style>
    :root {
      --bg: #0C0C0E;
      --ink: #F2F1ED;
      --gold: #E8B33A;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 8rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-align: center;
      padding: 0 0.4em;
      /* 极淡金色光晕，让大字在近黑底上更立体 */
      background: radial-gradient(
        120% 120% at 50% 50%,
        #ffffff 0%,
        var(--ink) 55%,
        #d9d4c7 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* 逗号后的 Terry 用琥珀金，作为唯一强调 */
    .accent {
      background: none;
      color: var(--gold);
      -webkit-text-fill-color: var(--gold);
    }
  </style>
</head>
<body>
  <h1>Hi，<span class="accent">Terry</span>！</h1>
</body>
</html>
